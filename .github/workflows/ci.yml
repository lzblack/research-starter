name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked pytest -m "not fixtures"
      - run: uv run --locked tools/public_scan.py

  fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.18"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            template/**/uv.lock.tmpl
      - run: uv sync --locked
      - run: uv run --locked pytest -m fixtures
