name: Feature request
description: Propose a change or addition to the template.
labels: [feedback]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which real problem in a research project would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would change. Deferred features are listed in the PRD's "Later" section; say if yours is one of them.
