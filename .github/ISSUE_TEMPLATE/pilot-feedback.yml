name: Feedback from using the template
description: What worked or did not work while using the template in a project.
labels: [feedback]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [setup, build, checks, memory and handoff, skills, documentation, other]
    validations:
      required: true
  - type: textarea
    id: feedback
    attributes:
      label: What happened, and what would have helped
      description: Do not include names, institutions, or data from your project.
    validations:
      required: true
